services:
  webhook:
    build: .
    container_name: auto_assemble_webhook
    restart: unless-stopped
    ports:
      - "5005:5005"
    volumes:
      - ./webhook/webhook_server.db:/app/webhook/webhook_server.db
      # .netrc 文件
      - ./resource/.netrc:/root/.netrc:ro
      # Android构建环境
      - android_sdk:/opt/android-sdk
      - gradle_cache:/root/.gradle
      - maven_cache:/root/.m2
      # Git仓库
      - distribution:/app/distribution
      - uni_base:/app/uni-base
    environment:
      - DISTRIBUTION_PATH=/app/distribution
      - ANDROID_UNI_BASE_PATH=/app/uni-base
      - WEBHOOK_URL=http://localhost:5005
      - PORT=5005
      - FLASK_DEBUG=false
    healthcheck:
      test: [ "CMD", "wget", "--spider", "-q", "http://localhost:5005/health" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    command: [ "python", "-m", "webhook" ]

volumes:
  android_sdk:
    name: auto_assemble_android_sdk
  gradle_cache:
    name: auto_assemble_gradle_cache
  maven_cache:
    name: auto_assemble_maven_cache
  distribution:
    name: auto_assemble_distribution
  uni_base:
    name: auto_assemble_uni_base

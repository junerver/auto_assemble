services:
  webhook:
    user: "1000:1000"
    image: auto_assemble-webhook:fast_api
    container_name: auto_assemble_webhook
    restart: unless-stopped
    ports:
      - "5005:5005"
    volumes:
      - ../src/webhook/webhook_server.db:/app/webhook/webhook_server.db
      # Android构建环境
      - android_sdk:/opt/android-sdk
      - gradle_cache:/home/appuser/.gradle
      - maven_cache:/home/appuser/.m2
      # Git仓库（从git-repo服务挂载）
      - git_repo_distribution:/app/distribution
      - git_repo_uni_base:/app/uni-base
      # 签名文件缓存、本地模式文件服务缓存
      - sign_file_cache:/app/sign
      - file_saver:/app/file_saver
    environment:
      - TZ=Asia/Shanghai
      - DISTRIBUTION_PATH=/app/distribution
      - ANDROID_UNI_BASE_PATH=/app/uni-base
      - SERVER_HOST_URL=http://localhost:5005
      - PORT=5005
      - FLASK_DEBUG=false
      # 混淆迁都
      - OBFUSCATOR_PRESET=low
      # 测试模式
      - API_TEST=true
      # 是否基于GitLab作为文件中转服务
      - BASE_ON_GITLAB=false
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:5005/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    command: ["uv", "run", "webhook"]
    depends_on:
      - git-repo

  git-repo:
    image: auto_assemble-repo:latest
    container_name: auto_assemble_git_repo
    restart: unless-stopped
    volumes:
      - git_repo_distribution:/app/distribution
      - git_repo_uni_base:/app/uni-base

volumes:
  android_sdk:
    name: auto_assemble_android_sdk
  gradle_cache:
    name: auto_assemble_gradle_cache
  maven_cache:
    name: auto_assemble_maven_cache
  git_repo_distribution:
    name: auto_assemble_git_repo_distribution
  git_repo_uni_base:
    name: auto_assemble_git_repo_uni_base
  sign_file_cache:
    name: auto_assemble_sign_file_cache
  file_saver:
    name: auto_assemble_file_saver

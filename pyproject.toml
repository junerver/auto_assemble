[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "auto_assemble"
version = "0.1.2"
description = "自动化打包工具"
authors = [
    { name = "Junerver", email = "junerver@gmail.com" }
]
dependencies = [
    "pyyaml>=6.0.2",
    "patool>=4.0.0",
    "rarfile>=4.2",
    "python-dotenv>=1.0.1",
]
requires-python = ">=3.8"
readme = "README.md"
license = { text = "MIT" }

[project.scripts]
auto-assemble = "auto_assemble.__main__:main"

[tool.setuptools]
packages = ["auto_assemble"]

[tool.black]
line-length = 100
target-version = ['py38']
include = '\.pyi?$'

[tool.isort]
profile = "black"
line_length = 100
multi_line_output = 3 
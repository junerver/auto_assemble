<!DOCTYPE html>
<html lang="zh">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>自动打包工具</title>
    <!-- 添加网页图标 -->
    <link rel="icon"
        href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🔧</text></svg>">
    <!-- 添加Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&display=swap" rel="stylesheet">
    <link href="/static/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" rel="stylesheet">
    <link href="/static/css/style.css" rel="stylesheet">
    <!-- 添加 clipboard.js -->
    <script src="/static/js/clipboard.min.js"></script>
</head>

<body>
    <div class="container">
        <h1 class="page-title text-center" id="pageTitle">Auto Assemble</h1>

        <!-- 项目列表模态窗口 -->
        <div class="modal fade" id="projectsModal" tabindex="-1" aria-labelledby="projectsModalLabel"
            aria-hidden="true">
            <div class="modal-dialog modal-xl">
                <div class="modal-content">
                    <div class="modal-header">
                        <h5 class="modal-title" id="projectsModalLabel">项目列表</h5>
                        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                    </div>
                    <div class="modal-body">
                        <div class="d-flex justify-content-end mb-3">
                            <button type="button" class="btn btn-primary me-2" onclick="showThirdPartyDict()">
                                <i class="bi bi-gear"></i> 第三方字典维护
                            </button>
                            <button type="button" class="btn btn-primary" onclick="showAddProject()">
                                <i class="bi bi-plus"></i> 新增项目
                            </button>
                        </div>
                        <div class="table-responsive">
                            <table class="table table-hover">
                                <thead>
                                    <tr>
                                        <th class="col-prod-name">产品名称</th>
                                        <th class="col-url">项目URL</th>
                                        <th class="col-hbx">HBX版本</th>
                                        <th class="col-uniapp-id">UniApp ID</th>
                                        <th class="col-uniapp-key">UniApp AppKey</th>
                                        <th class="col-cli text-center">CLI模式</th>
                                        <th class="col-actions text-center">操作</th>
                                    </tr>
                                </thead>
                                <tbody id="projectsTableBody">
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- 新增项目模态窗口 -->
        <div class="modal fade" id="addProjectModal" tabindex="-1" aria-labelledby="addProjectModalLabel"
            aria-hidden="true">
            <div class="modal-dialog modal-lg">
                <div class="modal-content">
                    <div class="modal-header">
                        <h5 class="modal-title" id="addProjectModalLabel">新增项目</h5>
                        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                    </div>
                    <div class="modal-body">
                        <form id="addProjectForm">
                            <div class="mb-3">
                                <label class="form-label">项目URL</label>
                                <input type="text" class="form-control" id="newProjectUrl" name="project_url" required>
                            </div>
                            <div class="mb-3">
                                <label class="form-label">产品名称</label>
                                <input type="text" class="form-control" id="newProdName" name="prod_name" required>
                            </div>
                            <div class="mb-3">
                                <label class="form-label">HBX版本</label>
                                <input type="text" class="form-control" id="newHbxVersion" name="hbx_version">
                            </div>
                            <div class="mb-3">
                                <label class="form-label">UniApp ID</label>
                                <input type="text" class="form-control" id="newUniappId" name="uniapp_id">
                            </div>
                            <div class="mb-3">
                                <label class="form-label">UniApp AppKey</label>
                                <input type="text" class="form-control" id="newUniappAppkey" name="uniapp_appkey">
                            </div>
                            <div class="mb-3">
                                <div class="form-check">
                                    <input class="form-check-input" type="checkbox" id="newUniappIsCli"
                                        name="uniapp_is_cli">
                                    <label class="form-check-label" for="newUniappIsCli">UniApp CLI模式</label>
                                </div>
                            </div>
                        </form>
                    </div>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">取消</button>
                        <button type="button" class="btn btn-primary" id="saveNewProject">保存</button>
                    </div>
                </div>
            </div>
        </div>

        <!-- 项目配置模态窗口 -->
        <div class="modal fade" id="projectConfigModal" tabindex="-1" aria-labelledby="projectConfigModalLabel"
            aria-hidden="true">
            <div class="modal-dialog modal-lg">
                <div class="modal-content">
                    <div class="modal-header">
                        <h5 class="modal-title" id="projectConfigModalLabel">项目配置</h5>
                        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                    </div>
                    <div class="modal-body">
                        <form id="projectConfigForm">
                            <div class="mb-3">
                                <label class="form-label">项目URL</label>
                                <input type="text" class="form-control" id="projectUrl" name="project_url">
                            </div>
                            <div class="mb-3">
                                <label class="form-label">产品名称</label>
                                <input type="text" class="form-control" id="prodName" name="prod_name">
                            </div>
                            <div class="mb-3">
                                <label class="form-label">HBX版本</label>
                                <input type="text" class="form-control" id="hbxVersion" name="hbx_version">
                            </div>
                            <div class="mb-3">
                                <label class="form-label">UniApp ID</label>
                                <input type="text" class="form-control" id="uniappId" name="uniapp_id">
                            </div>
                            <div class="mb-3">
                                <label class="form-label">UniApp AppKey</label>
                                <input type="text" class="form-control" id="uniappAppkey" name="uniapp_appkey">
                            </div>
                            <div class="mb-3">
                                <div class="form-check">
                                    <input class="form-check-input" type="checkbox" id="uniappIsCli"
                                        name="uniapp_is_cli">
                                    <label class="form-check-label" for="uniappIsCli">UniApp CLI模式</label>
                                </div>
                            </div>
                            <div class="mb-3">
                                <div class="d-flex justify-content-between align-items-center">
                                    <h6 class="mb-0">第三方配置</h6>
                                    <button type="button" class="btn btn-sm btn-primary"
                                        onclick="showAddThirdPartyConfig()">
                                        <i class="bi bi-plus"></i> 添加配置
                                    </button>
                                </div>
                                <div id="thirdPartyConfigs"></div>
                            </div>
                        </form>
                    </div>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">关闭</button>
                        <button type="button" class="btn btn-primary" id="saveProjectConfig">保存</button>
                    </div>
                </div>
            </div>
        </div>

        <!-- 添加第三方配置模态窗口 -->
        <div class="modal fade" id="addThirdPartyConfigModal" tabindex="-1"
            aria-labelledby="addThirdPartyConfigModalLabel" aria-hidden="true">
            <div class="modal-dialog">
                <div class="modal-content">
                    <div class="modal-header">
                        <h5 class="modal-title" id="addThirdPartyConfigModalLabel">添加第三方配置</h5>
                        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                    </div>
                    <div class="modal-body">
                        <form id="addThirdPartyConfigForm">
                            <div class="mb-3">
                                <label class="form-label">选择配置项</label>
                                <select class="form-select" id="dictItemSelect">
                                </select>
                            </div>
                            <div class="mb-3">
                                <label class="form-label">配置值</label>
                                <input type="text" class="form-control" id="configValue" required>
                            </div>
                        </form>
                    </div>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">取消</button>
                        <button type="button" class="btn btn-primary" id="saveThirdPartyConfig">保存</button>
                    </div>
                </div>
            </div>
        </div>

        <!-- 第三方字典维护模态窗口 -->
        <div class="modal fade" id="thirdPartyDictModal" tabindex="-1" aria-labelledby="thirdPartyDictModalLabel"
            aria-hidden="true">
            <div class="modal-dialog modal-xl">
                <div class="modal-content">
                    <div class="modal-header">
                        <h5 class="modal-title" id="thirdPartyDictModalLabel">第三方字典维护</h5>
                        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                    </div>
                    <div class="modal-body">
                        <div class="d-flex justify-content-end mb-3">
                            <button type="button" class="btn btn-primary" onclick="showAddDictItem()">
                                <i class="bi bi-plus"></i> 添加字典项
                            </button>
                        </div>
                        <div class="table-responsive">
                            <table class="table table-hover">
                                <thead>
                                    <tr>
                                        <th>提供商</th>
                                        <th>配置键</th>
                                        <th>配置值</th>
                                        <th>描述</th>
                                        <th>操作</th>
                                    </tr>
                                </thead>
                                <tbody id="dictTableBody">
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- 添加/编辑字典项模态窗口 -->
        <div class="modal fade" id="dictItemModal" tabindex="-1" aria-labelledby="dictItemModalLabel"
            aria-hidden="true">
            <div class="modal-dialog">
                <div class="modal-content">
                    <div class="modal-header">
                        <h5 class="modal-title" id="dictItemModalLabel">添加字典项</h5>
                        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                    </div>
                    <div class="modal-body">
                        <form id="dictItemForm">
                            <div class="mb-3">
                                <label class="form-label">提供商</label>
                                <input type="text" class="form-control" id="dictProvider" name="provider" required>
                            </div>
                            <div class="mb-3">
                                <label class="form-label">配置键</label>
                                <input type="text" class="form-control" id="dictKey" name="dict_key" required>
                            </div>
                            <div class="mb-3">
                                <label class="form-label">配置值</label>
                                <input type="text" class="form-control" id="dictValue" name="dict_value" required>
                            </div>
                            <div class="mb-3">
                                <label class="form-label">描述</label>
                                <input type="text" class="form-control" id="dictDescription" name="description"
                                    required>
                            </div>
                        </form>
                    </div>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">取消</button>
                        <button type="button" class="btn btn-primary" id="saveDictItem">保存</button>
                    </div>
                </div>
            </div>
        </div>

        <!-- 当前运行任务 -->
        <div class="card status-card">
            <div class="card-header">
                <h5 class="mb-0"><i class="bi bi-play-circle"></i> 当前运行任务</h5>
            </div>
            <div class="card-body" id="running-task">
                <div class="empty-state" id="no-running-task">
                    <i class="bi bi-check-circle"></i>
                    <p>暂无运行中的任务</p>
                </div>
            </div>
        </div>

        <!-- 等待队列 -->
        <div class="card status-card">
            <div class="card-header">
                <h5 class="mb-0"><i class="bi bi-list-ul"></i> 等待队列</h5>
                <span class="badge bg-primary" id="queue-size">0</span>
            </div>
            <div class="card-body" id="queue-list">
                <div class="empty-state" id="empty-queue">
                    <i class="bi bi-check-circle"></i>
                    <p>队列为空</p>
                </div>
            </div>
        </div>

        <!-- 最近任务 -->
        <div class="card status-card">
            <div class="card-header d-flex justify-content-between align-items-center">
                <h5 class="mb-0"><i class="bi bi-clock-history"></i> 最近任务</h5>
                <div class="task-filter-tags">
                    <span class="badge text-bg-primary me-1 cursor-pointer" data-build-mode="all">all</span>
                    <span class="badge text-bg-info me-1 cursor-pointer" data-build-mode="dev">dev</span>
                    <span class="badge text-bg-warning me-1 cursor-pointer" data-build-mode="test">test</span>
                    <span class="badge text-bg-success cursor-pointer" data-build-mode="release">release</span>
                </div>
            </div>
            <div class="card-body" id="recent-tasks">
                <div class="empty-state" id="no-recent-tasks">
                    <i class="bi bi-check-circle"></i>
                    <p>暂无最近任务</p>
                </div>
            </div>
        </div>
    </div>


    <script src="/static/js/bootstrap.bundle.min.js"></script>
    <script src="/static/js/main.js"></script>
    <script src="/static/js/third_party.js"></script>
    <script src="/static/js/replay.js"></script>
    <script src="/static/js/buildmode.js"></script>
</body>

</html>
